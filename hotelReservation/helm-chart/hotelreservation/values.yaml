global:
  nameOverride: ""
  fullnameOverride: ""
  mainChart: hotelres
  replicas: 1
  imagePullPolicy: "IfNotPresent"
  restartPolicy: Always
  serviceType: ClusterIP
  # Registry that hosts the hotelreservation-built images (frontend, search,
  # profile, reservation, recommendation, user, loader, etc.). This chart has
  # no sensible public default — images are built from this repository and
  # must be hosted somewhere the cluster can reach. Consumers MUST set this
  # value explicitly; leaving it blank causes helm template/install to fail
  # with an explanatory message.
  #
  # Example values:
  #   dockerRegistry: docker.io/opspai       # Docker Hub namespace
  #   dockerRegistry: ghcr.io/lgu-se-internal # GitHub Container Registry
  #   dockerRegistry: 10.10.10.240/library    # private harbor
  dockerRegistry: ""
  # Registry for infrastructure images (consul, memcached, mongodb, etc.).
  # Defaults to dockerRegistry for back-compat. Override this when your app
  # images live in a private registry but infra is pulled from a public one.
  #
  # Infra image names are flat (consul, memcached, mongo) so that setting
  # global.dockerRegistry=docker.io/<org> works with flat Docker Hub
  # registries (which do NOT allow nested repos like <org>/hashicorp/consul).
  #
  # To use PUBLIC docker.io images as infra (no mirror needed), set:
  #   global.infraDockerRegistry=docker.io/library
  # except for consul which lives under docker.io/hashicorp — override per-subchart:
  #   consul.container.dockerRegistry=docker.io/hashicorp
  infraDockerRegistry: ""  # blank = fallback to dockerRegistry
  defaultImageVersion: "0bf404"
  serviceDnsDomain: "cluster.local"
  otel:
    # OTEL collector endpoint in "host:port" form. Default targets the
    # per-namespace sidecar collector deployed by this chart (see
    # .Values.otelCollector). HS services use the OTLP/HTTP exporter, so the
    # default points at the collector's HTTP receiver port (4318).
    #
    # Override with --set global.otel.endpoint=<host:port> to route at a
    # shared cluster-wide collector (typical when otelCollector.enabled=false),
    # e.g. opentelemetry-kube-stack-deployment-hs-collector.monitoring.svc.cluster.local:4318
    #
    endpoint: "otel-collector:4318"
  services:
    environments:
      # TLS enablement
      #  - 0: Disable
      #  - 1: Enabled, using default cipher suite based on golang runtime
      #  - TLS_XXX: Enabled, using the specified Cipher suite, see tls/options.go#L22
      TLS: 0
      LOG_LEVEL: "INFO"
      OTEL_SAMPLE_RATIO: "1"
      MEMC_TIMEOUT: "2"
      GC: "100"
  affinity: {}
  tolerations: []
  nodeSelector: {}
  memcached:
    HACount: 1
    environments:
      MEMCACHED_CACHE_SIZE: "128"
      MEMCACHED_THREADS: "2"
  mongodb:
    persistentVolume:               # use hostPath or pvprovisioner
      enabled: false
      size: "1Gi"
      hostPath:
        enabled: false
        path: /tmp
      pvprovisioner:
        enabled: false
        storageClassName: ceph-fs   # optional

# Per-namespace OTLP collector sidecar.
#
# Deploys a single-replica otel-collector-contrib in the release namespace so
# each hotel-reservation install gets its own queue and exporter to ClickHouse,
# instead of all namespaces fanning into one shared cluster-wide collector
# (which saturates its ClickHouse exporter sending_queue and silently drops
# spans). See aegis #366 / #367.
#
# Disable to fall back to a shared collector — also override
# .global.otel.endpoint to point at that collector's URL.
otelCollector:
  enabled: true
  name: otel-collector
  replicas: 1
  image:
    # Public upstream is otel/opentelemetry-collector-contrib:0.142.0; the
    # docker.io/opspai mirror lets byte-cluster (volces auto-mirror) pull
    # without rate-limiting from upstream.
    repository: docker.io/opspai/opentelemetry-collector-contrib
    tag: "0.142.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi
  clickhouse:
    endpoint: "tcp://clickstack-clickhouse-clickhouse-headless.monitoring.svc.cluster.local:9000?dial_timeout=10s&compress=lz4&username=default"
    database: otel
    tracesTableName: otel_traces
    metricsTableName: otel_metrics
    logsTableName: otel_logs
    ttl: 72h
    timeout: 30s
  sendingQueue:
    enabled: true
    numConsumers: 10
    queueSize: 5000
    blocking: true
  batch:
    sendBatchSize: 2000
    sendBatchMaxSize: 4000
    timeout: 5s
  memoryLimiter:
    limitPercentage: 75
    spikeLimitPercentage: 15
