global:
  nameOverride: ""
  fullnameOverride: ""
  mainChart: hotelres
  replicas: 1
  imagePullPolicy: "IfNotPresent"
  restartPolicy: Always
  serviceType: ClusterIP
  # Registry that hosts the hotelreservation-built images (frontend, search,
  # profile, reservation, recommendation, user, loader, etc.). This chart has
  # no sensible public default — images are built from this repository and
  # must be hosted somewhere the cluster can reach. Consumers MUST set this
  # value explicitly; leaving it blank causes helm template/install to fail
  # with an explanatory message.
  #
  # Example values:
  #   dockerRegistry: docker.io/opspai       # Docker Hub namespace
  #   dockerRegistry: ghcr.io/lgu-se-internal # GitHub Container Registry
  #   dockerRegistry: 10.10.10.240/library    # private harbor
  dockerRegistry: ""
  # Registry for infrastructure images (consul, memcached, mongodb, etc.).
  # Defaults to dockerRegistry for back-compat. Override this when your app
  # images live in a private registry but infra is pulled from a public one.
  #
  # Infra image names are flat (consul, memcached, mongo) so that setting
  # global.dockerRegistry=docker.io/<org> works with flat Docker Hub
  # registries (which do NOT allow nested repos like <org>/hashicorp/consul).
  #
  # To use PUBLIC docker.io images as infra (no mirror needed), set:
  #   global.infraDockerRegistry=docker.io/library
  # except for consul which lives under docker.io/hashicorp — override per-subchart:
  #   consul.container.dockerRegistry=docker.io/hashicorp
  infraDockerRegistry: ""  # blank = fallback to dockerRegistry
  defaultImageVersion: "0bf404"
  serviceDnsDomain: "cluster.local"
  otel:
    # OTEL collector endpoint in "host:port" form (scheme auto-prefixed as
    # http:// if omitted). When empty, services default to the node-local
    # DaemonSet ($(NODE_IP):4318) which assumes an OTel-collector DaemonSet
    # on every node (e.g. opentelemetry-kube-stack on kind).
    #
    # For clusters with only a Deployment collector (e.g. VKE Byte), set:
    #   otel.endpoint: opentelemetry-kube-stack-deployment-collector.monitoring.svc.cluster.local:4318
    #
    endpoint: ""
  services:
    environments:
      # TLS enablement
      #  - 0: Disable
      #  - 1: Enabled, using default cipher suite based on golang runtime
      #  - TLS_XXX: Enabled, using the specified Cipher suite, see tls/options.go#L22
      TLS: 0
      LOG_LEVEL: "INFO"
      OTEL_SAMPLE_RATIO: "1"
      MEMC_TIMEOUT: "2"
      GC: "100"
  affinity: {}
  tolerations: []
  nodeSelector: {}
  memcached:
    HACount: 1
    environments:
      MEMCACHED_CACHE_SIZE: "128"
      MEMCACHED_THREADS: "2"
  mongodb:
    persistentVolume:               # use hostPath or pvprovisioner
      enabled: false
      size: "1Gi"
      hostPath:
        enabled: false
        path: /tmp
      pvprovisioner:
        enabled: false
        storageClassName: ceph-fs   # optional
