global:
  nameOverride: ""
  fullnameOverride: ""
  mainChart: hotelres
  replicas: 1
  imagePullPolicy: "IfNotPresent"
  restartPolicy: Always
  serviceType: ClusterIP
  # Registry that hosts the hotelreservation-built images (frontend, search,
  # profile, reservation, recommendation, user, loader, etc.). This chart has
  # no sensible public default — images are built from this repository and
  # must be hosted somewhere the cluster can reach. Consumers MUST set this
  # value explicitly; leaving it blank causes helm template/install to fail
  # with an explanatory message.
  #
  # Example values:
  #   dockerRegistry: docker.io/opspai       # Docker Hub namespace
  #   dockerRegistry: ghcr.io/lgu-se-internal # GitHub Container Registry
  #   dockerRegistry: 10.10.10.240/library    # private harbor
  dockerRegistry: ""
  # Registry for infrastructure images (consul, memcached, mongodb, redis, etc.).
  # Defaults to dockerRegistry for back-compat. Override this when your app
  # images live in a private registry but infra is pulled from a public one
  # (e.g., infraDockerRegistry: docker.io for upstream bitnami / library images).
  infraDockerRegistry: ""  # blank = fallback to dockerRegistry
  defaultImageVersion: "0bf404"
  serviceDnsDomain: "cluster.local"
  services:
    environments:
      # TLS enablement
      #  - 0: Disable
      #  - 1: Enabled, using default cipher suite based on golang runtime
      #  - TLS_XXX: Enabled, using the specified Cipher suite, see tls/options.go#L22
      TLS: 0
      LOG_LEVEL: "INFO"
      OTEL_SAMPLE_RATIO: "1"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://$(NODE_IP):4318"
      MEMC_TIMEOUT: "2"
      GC: "100"
  affinity: {}
  tolerations: []
  nodeSelector: {}
  memcached:
    HACount: 1
    environments:
      MEMCACHED_CACHE_SIZE: "128"
      MEMCACHED_THREADS: "2"
  mongodb:
    persistentVolume:               # use hostPath or pvprovisioner
      enabled: false
      size: "1Gi"
      hostPath:
        enabled: false
        path: /tmp
      pvprovisioner:
        enabled: false
        storageClassName: ceph-fs   # optional
