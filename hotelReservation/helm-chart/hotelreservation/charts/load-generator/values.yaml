name: load-generator

global:
  replicas: 1
  imagePullPolicy: "IfNotPresent"

container:
  name: load-generator
  image: 10.10.10.240/library/hotelreservation-loader
  imageVersion: "0bf404"

# Load test configuration
loadTest:
  enabled: true
  # Target service prefix (will be combined with helm release fullname)
  # The actual service name will be: frontend-<release-name>-hotelres
  targetServicePrefix: "frontend"
  targetPort: 5000
  # Workload script to use
  # Options: mixed-workload_type_1.lua, mixed-workload_type_1_with_attractions.lua
  script: "mixed-workload_type_1_with_attractions.lua"
  # Number of threads
  threads: 2
  # Number of connections
  connections: 2
  # Duration of the test (e.g., 30s, 5m, 1h, or "0" for infinite mode)
  # Set to "0" to trigger infinite mode (as implemented in modified wrk2)
  duration: "0"
  # Requests per second
  rate: 10
  # Additional wrk2 arguments
  additionalArgs: "-D exp -L"

# Whether to enable the load generator
enabled: true
