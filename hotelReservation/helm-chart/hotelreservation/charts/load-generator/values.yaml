name: load-generator

global:
  replicas: 1
  imagePullPolicy: "IfNotPresent"

container:
  name: load-generator
  image: 10.10.10.240/library/hotelreservation-loader
  imageVersion: "latest"

# Load test configuration
loadTest:
  enabled: true
  # Target service (frontend service)
  targetUrl: "http://frontend:5000"
  targetHost: "frontend"
  targetPort: 5000
  # Workload script to use
  # Options: mixed-workload_type_1.lua, mixed-workload_type_1_with_attractions.lua
  script: "mixed-workload_type_1_with_attractions.lua"
  # Number of threads
  threads: 2
  # Number of connections
  connections: 2
  # Duration of the test (e.g., 30s, 5m, 1h, 0 for infinite with custom wrk2)
  # Use "0" or add "-i" flag in additionalArgs if your custom wrk2 supports infinite mode
  duration: "0"
  # Requests per second
  rate: 10
  # Additional wrk2 arguments
  # Add "-i" here if your custom wrk2 binary supports the -i (infinite) flag
  additionalArgs: "-D exp -L"

# Whether to enable the load generator
enabled: true
