{{- if .Values.enabled }}
{{- $frontendServiceName := printf "%s-%s" .Values.loadTest.targetServicePrefix (include "hotel-reservation.fullname" .) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  labels:
    app: {{ .Values.name }}
spec:
  replicas: {{ .Values.global.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
    spec:
      containers:
      - name: {{ .Values.container.name }}
        image: {{ .Values.container.image }}:{{ .Values.container.imageVersion }}
        imagePullPolicy: {{ .Values.container.imagePullPolicy | default .Values.global.imagePullPolicy }}
        {{- if .Values.loadTest.enabled }}
        command:
        - /bin/sh
        - -c
        - |
          echo "Waiting for frontend service to be ready..."
          until nc -z {{ $frontendServiceName }} {{ .Values.loadTest.targetPort }}; do
            echo "Waiting for frontend..."
            sleep 5
          done
          echo "Frontend is ready. Starting load test..."
          wrk {{ .Values.loadTest.additionalArgs }} \
            -t {{ .Values.loadTest.threads }} \
            -c {{ .Values.loadTest.connections }} \
            -d {{ .Values.loadTest.duration }} \
            -s /hotel-reservation/wrk2/scripts/hotel-reservation/{{ .Values.loadTest.script }} \
            http://{{ $frontendServiceName }}:{{ .Values.loadTest.targetPort }} \
            -R {{ .Values.loadTest.rate }}
        {{- else }}
        command:
        - /bin/sh
        - -c
        - |
          echo "Load test disabled. Sleeping..."
          sleep infinity
        {{- end }}
{{- end }}
