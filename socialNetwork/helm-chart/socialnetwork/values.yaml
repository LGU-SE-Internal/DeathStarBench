global: 
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetMemoryUtilizationPercentage: '60'
    targetCPUUtilizationPercentage: '60'
  resources:
    limits:
      memory: 4Gi
    requests:
      memory: 2Gi
  replicas: 1
  imagePullPolicy: "IfNotPresent"
  restartPolicy: Always
  serviceType: ClusterIP
  # Registry that hosts the socialnetwork-built images (nginx-thrift, user
  # service, post service, social-graph, media, loader, etc.). This chart
  # has no sensible public default — images are built from this repository
  # and must be hosted somewhere the cluster can reach. Consumers MUST set
  # this value explicitly; leaving it blank causes helm template/install to
  # fail with an explanatory message.
  #
  # Example values:
  #   dockerRegistry: docker.io/opspai       # Docker Hub namespace
  #   dockerRegistry: ghcr.io/lgu-se-internal # GitHub Container Registry
  #   dockerRegistry: 10.10.10.240/library    # private harbor
  dockerRegistry: ""
  # Registry for infrastructure images (memcached, mongodb, redis, busybox,
  # git, etc.). Defaults to dockerRegistry for back-compat. Override this
  # when your app images live in a private registry but infra is pulled from
  # a public one.
  #
  # Infra image names are flat (memcached, mongo, redis, busybox, git) so
  # that setting global.dockerRegistry=docker.io/<org> works with flat
  # Docker Hub registries (which do NOT allow nested repos like
  # <org>/hashicorp/consul).
  #
  # To use PUBLIC docker.io images as infra (no mirror needed), set:
  #   global.infraDockerRegistry=docker.io/library
  # except for consul which lives under docker.io/hashicorp — override per-subchart:
  #   consul.container.dockerRegistry=docker.io/hashicorp
  infraDockerRegistry: ""  # blank = fallback to dockerRegistry
  defaultImageVersion: "778a8df"
  redis:
    cluster:
      enabled: false
    standalone:
      enabled: true
    replication:
      primary: redis-master
      replica: redis-replicas
      enabled: false
  memcached:
    cluster:
      enabled: false
      port: &memcached-cluster-port 5000
    standalone:
      enabled: true
  mongodb:
    standalone:
      enabled: true
    sharding:
      enabled: false
      svc:
        name: "mongodb-sharded"
        user: "root"
        password: &mongodb-sharded-password "password"
        port: 27017
  nginx:
    resolverName: kube-dns.kube-system.svc.cluster.local
  otel:
    # OTEL collector endpoint in "host:port" form (scheme auto-prefixed as
    # http:// if omitted). When empty, the template falls back to the
    # node-local DaemonSet default ($(NODE_IP):4318) which assumes an
    # OTel-collector DaemonSet is scheduled on every node (e.g. the
    # opentelemetry-kube-stack preset used on kind clusters).
    #
    # For clusters that only expose a Deployment collector (e.g. VKE Byte),
    # set:
    #   otel.endpoint: opentelemetry-kube-stack-deployment-collector.monitoring.svc.cluster.local:4318
    endpoint: ""
    samplerParam: 1
    disabled: false


mongodb-sharded:
  fullnameOverride: mongodb-sharded
  auth:
    rootPassword: *mongodb-sharded-password
  shards: 3
  shardsvr:
    dataNode:
      replicaCount: 3

mcrouter:
  controller: statefulset
  memcached:
    replicaCount: 3
  mcrouterCommandParams.port: *memcached-cluster-port

redis-cluster:
  usePassword: false
  redis:
    # default readiness / liveness probes are causing issues, rising timeouts/delays might help
    # cluster health check will be handled by post-commit hook
    readinessProbe:
      enabled: false
    livenessProbe:
      enabled: false

redis:
  fullnameOverride: "redis"
  auth:
    enabled: false
  master:
    persistence:
      enabled: false
  replica:
    persistence:
      enabled: false
    replicaCount: 6
