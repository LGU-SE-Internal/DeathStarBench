name: load-generator

global:
  replicas: 1
  imagePullPolicy: "IfNotPresent"

container:
  name: load-generator
  image: 10.10.10.240/library/socialnetwork-loader
  imageVersion: "latest"

# Load test configuration
loadTest:
  enabled: true
  # Target service (nginx-thrift service)
  targetUrl: "http://nginx-thrift:8080"
  targetHost: "nginx-thrift"
  targetPort: 8080
  # Workload script to use
  # Options: compose-post.lua, read-home-timeline.lua, read-user-timeline.lua, mixed-workload.lua
  script: "compose-post.lua"
  # Endpoint path
  endpoint: "/wrk2-api/post/compose"
  # Number of threads
  threads: 2
  # Number of connections
  connections: 2
  # Duration of the test (e.g., 30s, 5m, 1h, 0 for infinite with custom wrk2)
  # Use "0" or add "-i" flag in additionalArgs if your custom wrk2 supports infinite mode
  duration: "0"
  # Requests per second
  rate: 10
  # Additional wrk2 arguments
  # Add "-i" here if your custom wrk2 binary supports the -i (infinite) flag
  additionalArgs: "-D exp -L"

# Whether to enable the load generator
enabled: true
