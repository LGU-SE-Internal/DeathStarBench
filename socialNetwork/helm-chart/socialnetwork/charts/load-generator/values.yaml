name: load-generator

global:
  replicas: 1
  imagePullPolicy: "IfNotPresent"

container:
  name: load-generator
  # Blank dockerRegistry falls back to global.dockerRegistry (same pattern as app services).
  dockerRegistry: ""
  # Image name only (no registry prefix). The registry is prepended from
  # container.dockerRegistry or global.dockerRegistry.
  image: socialnetwork-loader
  # Leave blank to fall back to global.defaultImageVersion; override to pin a specific tag.
  imageVersion: ""

# Init container configuration for data initialization.
# The data-init container reuses the load-generator image (container.image),
# which bakes python3 + aiohttp + netcat — no public-network install at pod start.
initContainer:
  # Enable data initialization before starting load generator
  enabled: true
  # Server address and port for API calls (nginx service)
  serverAddress: "nginx-thrift"
  serverPort: "8080"
  # Social graph to use for initialization
  # Options: socfb-Reed98 (default), ego-twitter, soc-twitter-follows-mun
  graphName: "socfb-Reed98"
  # Whether to compose posts after creating users and follows
  composePosts: false

# Dataset image configuration. When enabled (default), an init container pulls
# a pre-baked datasets+scripts image and `cp -r`'s its contents into the shared
# volume — replacing the legacy `git clone https://github.com/.../DeathStarBench`
# init container, which is unreliable on clusters with constrained GitHub egress.
# Set datasetImage.enabled=false to fall back to the old git-clone behavior.
datasetImage:
  enabled: true
  # Blank dockerRegistry falls back to global.dockerRegistry (same pattern as
  # the load-generator container.dockerRegistry above).
  dockerRegistry: ""
  # Image name only (no registry prefix). The registry is prepended from
  # datasetImage.dockerRegistry or global.dockerRegistry.
  image: loader-datasets
  # Leave blank to fall back to global.defaultImageVersion (or "latest"); override
  # to pin a specific tag for reproducibility.
  imageVersion: ""
  imagePullPolicy: ""

# Load test configuration
loadTest:
  enabled: true
  # Target service (nginx-thrift service)
  targetUrl: "http://nginx-thrift:8080"
  targetHost: "nginx-thrift"
  targetPort: 8080
  # Workload script to use
  # Options: compose-post.lua, read-home-timeline.lua, read-user-timeline.lua, mixed-workload.lua
  script: "mixed-workload.lua"
  # Endpoint path (not used for mixed-workload.lua, script handles endpoints internally)
  endpoint: "/wrk2-api/post/compose"
  # Number of threads
  threads: 2
  # Number of connections
  connections: 2
  # Duration of the test (e.g., 30s, 5m, 1h, or "0" for infinite mode)
  # Set to "0" to trigger infinite mode (as implemented in modified wrk2)
  duration: "0"
  # Requests per second
  rate: 10
  # Additional wrk2 arguments
  additionalArgs: "-D exp -L"

# Whether to enable the load generator
enabled: true
