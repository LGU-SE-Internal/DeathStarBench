{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  labels:
    app: {{ .Values.name }}
spec:
  replicas: {{ .Values.global.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
    spec:
      {{- if .Values.initContainer.enabled }}
      initContainers:
      # Wait for nginx-thrift to be ready
      - name: wait-for-nginx
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z {{ .Values.loadTest.targetHost }} {{ .Values.loadTest.targetPort }}; do echo waiting for {{ .Values.loadTest.targetHost }}; sleep 5; done;']
      # Fetch datasets from repository
      - name: fetch-datasets
        image: alpine/git:latest
        command:
        - /bin/sh
        - -c
        - |
          echo "Cloning DeathStarBench repository to get datasets..."
          cd /data
          git clone --depth 1 https://github.com/delimitrou/DeathStarBench.git
          ls -lh /data/DeathStarBench/socialNetwork/datasets/social-graph/
        volumeMounts:
        - name: data-volume
          mountPath: /data
      # Initialize social graph data
      - name: data-init
        image: {{ .Values.initContainer.image }}:{{ .Values.initContainer.imageVersion }}
        command:
        - /bin/sh
        - -c
        - |
          set -x
          echo "=== Starting data initialization ==="
          cd /data/DeathStarBench/socialNetwork
          echo "=== Installing aiohttp ==="
          pip install aiohttp
          
          echo "=== Verifying files exist ==="
          ls -la datasets/social-graph/{{ .Values.initContainer.graphName }}/
          
          echo "=== Testing nginx connection ==="
          nc -zv {{ .Values.initContainer.serverAddress }} {{ .Values.initContainer.serverPort }}
          
          echo "=== Starting initialization script ==="
          python3 -u scripts/init_social_graph.py \
            --ip {{ .Values.initContainer.serverAddress }} \
            --port {{ .Values.initContainer.serverPort }} \
            --graph {{ .Values.initContainer.graphName }} \
            {{ if .Values.initContainer.composePosts }}--compose{{ end }}
          
          echo "=== Initialization completed ==="
        volumeMounts:
        - name: data-volume
          mountPath: /data
      {{- end }}
      containers:
      - name: {{ .Values.container.name }}
        image: {{ .Values.container.image }}:{{ .Values.container.imageVersion }}
        imagePullPolicy: {{ .Values.container.imagePullPolicy | default .Values.global.imagePullPolicy }}
        {{- if .Values.loadTest.enabled }}
        command:
        - /bin/sh
        - -c
        - |
          echo "Starting load test..."
          wrk {{ .Values.loadTest.additionalArgs }} \
            -t {{ .Values.loadTest.threads }} \
            -c {{ .Values.loadTest.connections }} \
            -d {{ .Values.loadTest.duration }} \
            -R {{ .Values.loadTest.rate }} \
            -s /social-network-microservices/wrk2/scripts/social-network/{{ .Values.loadTest.script }} \
            {{ .Values.loadTest.targetUrl }}{{ .Values.loadTest.endpoint }}
        {{- else }}
        command:
        - /bin/sh
        - -c
        - |
          echo "Load test disabled. Sleeping..."
          sleep infinity
        {{- end }}
      volumes:
      - name: data-volume
        emptyDir: {}
{{- end }}
