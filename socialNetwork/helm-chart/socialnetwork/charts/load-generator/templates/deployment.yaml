{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  labels:
    app: {{ .Values.name }}
spec:
  replicas: {{ .Values.global.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
    spec:
      {{- if .Values.initContainer.enabled }}
      initContainers:
      # Wait for nginx-thrift to be ready
      - name: wait-for-nginx
        {{- $infraRegistry := .Values.global.infraDockerRegistry | default .Values.global.dockerRegistry }}
        {{- if eq $infraRegistry "" }}{{- fail "global.dockerRegistry (or global.infraDockerRegistry) must be set; see values.yaml for details" }}{{- end }}
        image: {{ $infraRegistry }}/busybox:1.36
        command: ['sh', '-c', 'until nc -z {{ .Values.loadTest.targetHost }} {{ .Values.loadTest.targetPort }}; do echo waiting for {{ .Values.loadTest.targetHost }}; sleep 5; done;']
      {{- if .Values.datasetImage.enabled }}
      # Copy datasets from a pre-baked image (no GitHub egress at pod-start time).
      - name: copy-datasets
        {{- $datasetRegistry := .Values.datasetImage.dockerRegistry | default .Values.global.dockerRegistry }}
        {{- if eq $datasetRegistry "" }}{{- fail "global.dockerRegistry (or load-generator.datasetImage.dockerRegistry) must be set when datasetImage.enabled=true" }}{{- end }}
        image: {{ $datasetRegistry }}/{{ .Values.datasetImage.image }}:{{ .Values.datasetImage.imageVersion | default .Values.global.defaultImageVersion | default "latest" }}
        imagePullPolicy: {{ .Values.datasetImage.imagePullPolicy | default .Values.global.imagePullPolicy }}
        command:
        - /bin/sh
        - -c
        - |
          set -eu
          echo "Copying pre-baked datasets into shared volume..."
          mkdir -p /data/DeathStarBench
          cp -r /datasets/socialNetwork /data/DeathStarBench/socialNetwork
          ls -lh /data/DeathStarBench/socialNetwork/datasets/social-graph/
          echo "Datasets ready."
        volumeMounts:
        - name: data-volume
          mountPath: /data
      {{- else }}
      # Legacy fallback: clone the upstream DSB repo at pod-start time.
      # Kept for back-compat; prefer datasetImage.enabled=true on clusters with
      # constrained GitHub egress.
      - name: fetch-datasets
        image: {{ $infraRegistry }}/git:latest
        command:
        - /bin/sh
        - -c
        - |
          echo "Cloning DeathStarBench repository to get datasets..."
          cd /data
          git clone --depth 1 https://github.com/delimitrou/DeathStarBench.git
          ls -lh /data/DeathStarBench/socialNetwork/datasets/social-graph/
        volumeMounts:
        - name: data-volume
          mountPath: /data
      {{- end }}
      # Initialize social graph data
      - name: data-init
        image: {{ .Values.initContainer.image }}:{{ .Values.initContainer.imageVersion }}
        command:
        - /bin/sh
        - -c
        - |
          set -x
          echo "=== Starting data initialization ==="
          cd /data/DeathStarBench/socialNetwork
          echo "=== Installing aiohttp ==="
          pip install aiohttp
          
          echo "=== Verifying files exist ==="
          ls -la datasets/social-graph/{{ .Values.initContainer.graphName }}/
          
          echo "=== Testing nginx connection ==="
          nc -zv {{ .Values.initContainer.serverAddress }} {{ .Values.initContainer.serverPort }}
          
          echo "=== Starting initialization script ==="
          python3 -u scripts/init_social_graph.py \
            --ip {{ .Values.initContainer.serverAddress }} \
            --port {{ .Values.initContainer.serverPort }} \
            --graph {{ .Values.initContainer.graphName }} \
            {{ if .Values.initContainer.composePosts }}--compose{{ end }}
          
          echo "=== Initialization completed ==="
        volumeMounts:
        - name: data-volume
          mountPath: /data
      {{- end }}
      containers:
      - name: {{ .Values.container.name }}
        {{- $registry := .Values.container.dockerRegistry | default .Values.global.dockerRegistry }}
        {{- if eq $registry "" }}{{- fail "global.dockerRegistry (or load-generator.container.dockerRegistry) must be set; see values.yaml for details" }}{{- end }}
        image: {{ $registry }}/{{ .Values.container.image }}:{{ .Values.container.imageVersion | default .Values.global.defaultImageVersion }}
        imagePullPolicy: {{ .Values.container.imagePullPolicy | default .Values.global.imagePullPolicy }}
        {{- if .Values.loadTest.enabled }}
        command:
        - /bin/sh
        - -c
        - |
          echo "Starting load test..."
          wrk {{ .Values.loadTest.additionalArgs }} \
            -t {{ .Values.loadTest.threads }} \
            -c {{ .Values.loadTest.connections }} \
            -d {{ .Values.loadTest.duration }} \
            -R {{ .Values.loadTest.rate }} \
            -s /social-network-microservices/wrk2/scripts/social-network/{{ .Values.loadTest.script }} \
            {{ .Values.loadTest.targetUrl }}{{ .Values.loadTest.endpoint }}
        {{- else }}
        command:
        - /bin/sh
        - -c
        - |
          echo "Load test disabled. Sleeping..."
          sleep infinity
        {{- end }}
      volumes:
      - name: data-volume
        emptyDir: {}
{{- end }}
