{{- if .Values.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.name }}
  labels:
    app: {{ .Values.name }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-timeout": "{{ .Values.job.hookTimeout }}s"
spec:
  backoffLimit: {{ .Values.job.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.job.ttlSecondsAfterFinished }}
  activeDeadlineSeconds: {{ .Values.job.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
    spec:
      restartPolicy: {{ .Values.job.restartPolicy }}
      initContainers:
      - name: wait-for-nginx
        {{- $infraRegistry := .Values.global.infraDockerRegistry | default .Values.global.dockerRegistry }}
        {{- if eq $infraRegistry "" }}{{- fail "global.dockerRegistry (or global.infraDockerRegistry) must be set; see values.yaml for details" }}{{- end }}
        image: {{ $infraRegistry }}/busybox:1.28
        command: ['sh', '-c', 'until nc -z nginx-thrift 8080; do echo waiting for nginx-thrift; sleep 5; done;']
      {{- if .Values.datasetImage.enabled }}
      # Copy datasets from a pre-baked image (no GitHub egress at pod-start time).
      - name: copy-datasets
        {{- $datasetRegistry := .Values.datasetImage.dockerRegistry | default .Values.global.dockerRegistry }}
        {{- if eq $datasetRegistry "" }}{{- fail "global.dockerRegistry (or data-init-job.datasetImage.dockerRegistry) must be set when datasetImage.enabled=true" }}{{- end }}
        image: {{ $datasetRegistry }}/{{ .Values.datasetImage.image }}:{{ .Values.datasetImage.imageVersion | default .Values.global.defaultImageVersion | default "latest" }}
        imagePullPolicy: {{ .Values.datasetImage.imagePullPolicy | default .Values.global.imagePullPolicy }}
        command:
        - /bin/sh
        - -c
        - |
          set -eu
          echo "Copying pre-baked datasets into shared volume..."
          mkdir -p /data/DeathStarBench
          cp -r /datasets/socialNetwork /data/DeathStarBench/socialNetwork
          ls -lh /data/DeathStarBench/socialNetwork/datasets/social-graph/
          echo "Datasets ready."
        volumeMounts:
        - name: data-volume
          mountPath: /data
      {{- else }}
      # Legacy fallback: clone the upstream DSB repo at pod-start time.
      - name: fetch-datasets
        image: {{ $infraRegistry }}/git:latest
        command:
        - /bin/sh
        - -c
        - |
          echo "Cloning DeathStarBench repository to get datasets..."
          cd /data
          git clone https://github.com/delimitrou/DeathStarBench.git
          ls -lh /data/DeathStarBench/socialNetwork/datasets/social-graph/
        volumeMounts:
        - name: data-volume
          mountPath: /data
      {{- end }}
      containers:
      - name: {{ .Values.container.name }}
        image: {{ .Values.container.image }}:{{ .Values.container.imageVersion }}
        imagePullPolicy: {{ .Values.container.imagePullPolicy | default .Values.global.imagePullPolicy }}
        command:
        - /bin/sh
        - -c
        - |
          set -x
          echo "=== Starting data initialization ==="
          cd /data/DeathStarBench/socialNetwork
          echo "=== Installing aiohttp ==="
          pip install aiohttp
          
          echo "=== Verifying files exist ==="
          ls -la datasets/social-graph/{{ .Values.graphName }}/
          
          echo "=== Testing nginx connection ==="
          nc -zv {{ .Values.serverAddress }}.{{ .Release.Namespace }}.svc.cluster.local {{ .Values.serverPort }}
          
          echo "=== Starting initialization script ==="
          python3 -u scripts/init_social_graph.py \
            --ip {{ .Values.serverAddress }}.{{ .Release.Namespace }}.svc.cluster.local \
            --port {{ .Values.serverPort }} \
            --graph {{ .Values.graphName }} \
            {{ if .Values.composePosts }}--compose{{ end }}
          
          echo "=== Initialization completed ==="
        volumeMounts:
        - name: data-volume
          mountPath: /data
      volumes:
      - name: data-volume
        emptyDir: {}
{{- end }}