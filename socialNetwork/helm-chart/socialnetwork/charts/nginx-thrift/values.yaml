name: nginx-thrift

ports:
  - port: 8080
    targetPort: 8080

container:
  image: sn-openresty-thrift
  imageVersion: be28ed6
  name: nginx-thrift
  # nginx-thrift edge idles ~505Mi resident — give it a 1.5Gi ceiling so normal
  # traffic never OOMs while memory_stress still has room to breach (aegis#563).
  resources:
    requests:
      cpu: 50m
      memory: 640Mi
    limits:
      cpu: 500m
      memory: 1536Mi
  ports:
  - containerPort: 8080
  env:
  - name: fqdn_suffix
    value: ".{{ .Release.Namespace }}.svc.cluster.local"

configMaps:
  - name: nginx.conf
    mountPath: /usr/local/openresty/nginx/conf/nginx.conf 
    value: nginx
