{{- if .Values.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.name }}
  labels:
    app: {{ .Values.name }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-timeout": "{{ .Values.job.hookTimeout }}s"
spec:
  backoffLimit: {{ .Values.job.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.job.ttlSecondsAfterFinished }}
  activeDeadlineSeconds: {{ .Values.job.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
    spec:
      restartPolicy: {{ .Values.job.restartPolicy }}
      initContainers:
      - name: wait-for-nginx
        {{- $infraRegistry := .Values.global.infraDockerRegistry | default .Values.global.dockerRegistry }}
        {{- if eq $infraRegistry "" }}{{- fail "global.dockerRegistry (or global.infraDockerRegistry) must be set; see values.yaml for details" }}{{- end }}
        image: {{ $infraRegistry }}/busybox:1.28
        command: ['sh', '-c', 'until nc -z nginx-web-server 8080; do echo waiting for nginx-web-server; sleep 5; done;']
      {{- if .Values.datasetImage.enabled }}
      # Copy datasets from a pre-baked image (no GitHub egress at pod-start time).
      - name: copy-datasets
        {{- $datasetRegistry := .Values.datasetImage.dockerRegistry | default .Values.global.dockerRegistry }}
        {{- if eq $datasetRegistry "" }}{{- fail "global.dockerRegistry (or data-init-job.datasetImage.dockerRegistry) must be set when datasetImage.enabled=true" }}{{- end }}
        image: {{ $datasetRegistry }}/{{ .Values.datasetImage.image }}:{{ .Values.datasetImage.imageVersion | default .Values.global.defaultImageVersion | default "latest" }}
        imagePullPolicy: {{ .Values.datasetImage.imagePullPolicy | default .Values.global.imagePullPolicy }}
        command:
        - /bin/sh
        - -c
        - |
          set -eu
          echo "Copying pre-baked datasets into shared volume..."
          cp -r /datasets/mediaMicroservices/datasets /data/datasets
          cp /datasets/mediaMicroservices/scripts/write_movie_info.py /data/write_movie_info.py
          ls -lh /data/datasets/tmdb/
          echo "Datasets ready."
        volumeMounts:
        - name: data-volume
          mountPath: /data
      {{- else }}
      # Legacy fallback: clone the LGU DSB fork at pod-start time.
      - name: fetch-datasets
        image: {{ $infraRegistry }}/git:latest
        command:
        - /bin/sh
        - -c
        - |
          echo "Cloning DeathStarBench repository to get datasets..."
          git clone --depth 1 https://github.com/LGU-SE-Internal/DeathStarBench.git /tmp/repo
          echo "Copying datasets..."
          cp -r /tmp/repo/mediaMicroservices/datasets /data/
          cp /tmp/repo/mediaMicroservices/scripts/write_movie_info.py /data/
          echo "Datasets fetched successfully!"
          ls -lh /data/datasets/tmdb/
        volumeMounts:
        - name: data-volume
          mountPath: /data
      {{- end }}
      containers:
      - name: {{ .Values.container.name }}
        image: {{ .Values.container.image }}:{{ .Values.container.imageVersion }}
        imagePullPolicy: {{ .Values.container.imagePullPolicy | default .Values.global.imagePullPolicy }}
        command:
        - /bin/sh
        - -c
        - |
          echo "Installing required packages..."
          apt-get update && apt-get install -y curl
          pip install --no-cache-dir aiohttp
          
          echo "Waiting for services to be ready..."
          sleep 15
          
          echo "Starting data initialization..."
          cd /data
          
          echo "Writing movie information..."
          python3 write_movie_info.py \
            -c /data/datasets/tmdb/casts.json \
            -m /data/datasets/tmdb/movies.json \
            --server_address {{ tpl .Values.serverAddress . }}
          
          echo "Registering users..."
          # Register users in parallel batches for faster execution
          for batch_start in $(seq 1 20 1000); do
            batch_end=$((batch_start + 19))
            for i in $(seq $batch_start $batch_end); do
              curl -s -X POST \
                -d "first_name=first_name_$i&last_name=last_name_$i&username=username_$i&password=password_$i" \
                {{ tpl .Values.serverAddress . }}/wrk2-api/user/register &
            done
            # Wait for current batch to complete before starting next batch
            wait
            echo "Registered users $batch_start to $batch_end"
          done
          
          echo "Data initialization completed successfully!"
        volumeMounts:
        - name: data-volume
          mountPath: /data
      volumes:
      - name: data-volume
        emptyDir: {}
{{- end }}
