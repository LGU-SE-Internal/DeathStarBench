{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  labels:
    app: {{ .Values.name }}
spec:
  replicas: {{ .Values.global.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
    spec:
      {{- if .Values.initContainer.enabled }}
      initContainers:
      # Wait for nginx-web-server to be ready
      - name: wait-for-nginx
        {{- $infraRegistry := .Values.global.infraDockerRegistry | default .Values.global.dockerRegistry }}
        {{- if eq $infraRegistry "" }}{{- fail "global.dockerRegistry (or global.infraDockerRegistry) must be set; see values.yaml for details" }}{{- end }}
        image: {{ $infraRegistry }}/busybox:1.36
        command: ['sh', '-c', 'until nc -z {{ .Values.loadTest.targetHost }} {{ .Values.loadTest.targetPort }}; do echo waiting for {{ .Values.loadTest.targetHost }}; sleep 5; done;']
      {{- if .Values.datasetImage.enabled }}
      # Copy datasets from a pre-baked image (no GitHub egress at pod-start time).
      - name: copy-datasets
        {{- $datasetRegistry := .Values.datasetImage.dockerRegistry | default .Values.global.dockerRegistry }}
        {{- if eq $datasetRegistry "" }}{{- fail "global.dockerRegistry (or load-generator.datasetImage.dockerRegistry) must be set when datasetImage.enabled=true" }}{{- end }}
        image: {{ $datasetRegistry }}/{{ .Values.datasetImage.image }}:{{ .Values.datasetImage.imageVersion | default .Values.global.defaultImageVersion | default "latest" }}
        imagePullPolicy: {{ .Values.datasetImage.imagePullPolicy | default .Values.global.imagePullPolicy }}
        command:
        - /bin/sh
        - -c
        - |
          set -eu
          echo "Copying pre-baked datasets into shared volume..."
          cp -r /datasets/mediaMicroservices/datasets /data/datasets
          cp /datasets/mediaMicroservices/scripts/write_movie_info.py /data/write_movie_info.py
          ls -lh /data/datasets/tmdb/
          echo "Datasets ready."
        volumeMounts:
        - name: data-volume
          mountPath: /data
      {{- else }}
      # Legacy fallback: clone the LGU DSB fork at pod-start time.
      # Kept for back-compat; prefer datasetImage.enabled=true on clusters with
      # constrained GitHub egress.
      - name: fetch-datasets
        image: {{ $infraRegistry }}/git:latest
        command:
        - /bin/sh
        - -c
        - |
          echo "Cloning DeathStarBench repository to get datasets..."
          git clone --depth 1 https://github.com/LGU-SE-Internal/DeathStarBench.git /tmp/repo
          echo "Copying datasets..."
          cp -r /tmp/repo/mediaMicroservices/datasets /data/
          cp /tmp/repo/mediaMicroservices/scripts/write_movie_info.py /data/
          echo "Datasets fetched successfully!"
          ls -lh /data/datasets/tmdb/
        volumeMounts:
        - name: data-volume
          mountPath: /data
      {{- end }}
      # Initialize data (movies, casts, users). Reuses the load-generator image,
      # which bakes python3 + aiohttp + curl — no public-network install at pod start.
      - name: data-init
        {{- $initRegistry := .Values.container.dockerRegistry | default .Values.global.dockerRegistry }}
        {{- if eq $initRegistry "" }}{{- fail "global.dockerRegistry (or load-generator.container.dockerRegistry) must be set; see values.yaml for details" }}{{- end }}
        image: {{ $initRegistry }}/{{ .Values.container.image }}:{{ .Values.container.imageVersion | default .Values.global.defaultImageVersion }}
        imagePullPolicy: {{ .Values.container.imagePullPolicy | default .Values.global.imagePullPolicy }}
        command:
        - /bin/sh
        - -c
        - |
          echo "Starting data initialization..."
          cd /data
          
          echo "Writing movie information..."
          python3 write_movie_info.py \
            -c /data/datasets/tmdb/casts.json \
            -m /data/datasets/tmdb/movies.json \
            --server_address {{ .Values.initContainer.serverAddress }} \
            --wait-timeout {{ .Values.initContainer.waitTimeout | default 60 }}
          
          echo "Registering users..."
          # Register users in parallel batches for faster execution
          for batch_start in $(seq 1 20 1000); do
            batch_end=$((batch_start + 19))
            for i in $(seq $batch_start $batch_end); do
              curl -s -X POST \
                -d "first_name=first_name_$i&last_name=last_name_$i&username=username_$i&password=password_$i" \
                {{ .Values.initContainer.serverAddress }}/wrk2-api/user/register &
            done
            # Wait for current batch to complete before starting next batch
            wait
            echo "Registered users $batch_start to $batch_end"
          done
          
          echo "Data initialization completed successfully!"
        volumeMounts:
        - name: data-volume
          mountPath: /data
      {{- end }}
      containers:
      - name: {{ .Values.container.name }}
        {{- $registry := .Values.container.dockerRegistry | default .Values.global.dockerRegistry }}
        {{- if eq $registry "" }}{{- fail "global.dockerRegistry (or load-generator.container.dockerRegistry) must be set; see values.yaml for details" }}{{- end }}
        image: {{ $registry }}/{{ .Values.container.image }}:{{ .Values.container.imageVersion | default .Values.global.defaultImageVersion }}
        imagePullPolicy: {{ .Values.container.imagePullPolicy | default .Values.global.imagePullPolicy }}
        {{- if .Values.loadTest.enabled }}
        command:
        - /bin/sh
        - -c
        - |
          echo "Starting load test..."
          wrk {{ .Values.loadTest.additionalArgs }} \
            -t {{ .Values.loadTest.threads }} \
            -c {{ .Values.loadTest.connections }} \
            -d {{ .Values.loadTest.duration }} \
            -R {{ .Values.loadTest.rate }} \
            -s /media-microservices/wrk2/scripts/media-microservices/{{ .Values.loadTest.script }} \
            {{ .Values.loadTest.targetUrl }}{{ .Values.loadTest.endpoint }}
        {{- else }}
        command:
        - /bin/sh
        - -c
        - |
          echo "Load test disabled. Sleeping..."
          sleep infinity
        {{- end }}
      volumes:
      - name: data-volume
        emptyDir: {}
{{- end }}
