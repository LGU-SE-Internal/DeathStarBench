{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  labels:
    app: {{ .Values.name }}
spec:
  replicas: {{ .Values.global.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
    spec:
      containers:
      - name: {{ .Values.container.name }}
        image: {{ .Values.container.image }}:{{ .Values.container.imageVersion }}
        imagePullPolicy: {{ .Values.container.imagePullPolicy | default .Values.global.imagePullPolicy }}
        {{- if .Values.loadTest.enabled }}
        command:
        - /bin/sh
        - -c
        - |
          echo "Waiting for nginx-web-server service to be ready..."
          until nc -z {{ .Values.loadTest.targetHost }} {{ .Values.loadTest.targetPort }}; do
            echo "Waiting for nginx-web-server..."
            sleep 5
          done
          echo "Nginx-web-server is ready. Starting load test..."
          {{- if .Values.loadTest.continuous }}
          # Continuous mode: run load test in a loop
          while true; do
            echo "Starting load test cycle at $(date)"
            wrk {{ .Values.loadTest.additionalArgs }} \
              -t {{ .Values.loadTest.threads }} \
              -c {{ .Values.loadTest.connections }} \
              -d {{ .Values.loadTest.duration }} \
              -s /media-microservices/wrk2/scripts/media-microservices/{{ .Values.loadTest.script }} \
              {{ .Values.loadTest.targetUrl }}{{ .Values.loadTest.endpoint }} \
              -R {{ .Values.loadTest.rate }}
            EXIT_CODE=$?
            if [ $EXIT_CODE -ne 0 ]; then
              echo "Load test failed with exit code $EXIT_CODE, restarting in 5 seconds..."
              sleep 5
            else
              echo "Load test cycle completed successfully, restarting immediately..."
            fi
          done
          {{- else }}
          # Single run mode
          wrk {{ .Values.loadTest.additionalArgs }} \
            -t {{ .Values.loadTest.threads }} \
            -c {{ .Values.loadTest.connections }} \
            -d {{ .Values.loadTest.duration }} \
            -s /media-microservices/wrk2/scripts/media-microservices/{{ .Values.loadTest.script }} \
            {{ .Values.loadTest.targetUrl }}{{ .Values.loadTest.endpoint }} \
            -R {{ .Values.loadTest.rate }}
          echo "Load test completed. Sleeping..."
          sleep infinity
          {{- end }}
        {{- else }}
        command:
        - /bin/sh
        - -c
        - |
          echo "Load test disabled. Sleeping..."
          sleep infinity
        {{- end }}
{{- end }}
