name: load-generator

global:
  replicas: 1
  imagePullPolicy: "IfNotPresent"

container:
  name: load-generator
  image: 10.10.10.240/library/mediamicroservices-loader
  imageVersion: "60283c4"

# Init container configuration
initContainer:
  # Wait for data-init-job to complete before starting load generator
  enabled: true
  # Name of the data init job to wait for
  dataInitJobName: "data-init-job"
  # kubectl image for checking job status
  kubectlImage: "bitnami/kubectl:latest"

# Load test configuration
loadTest:
  enabled: true
  # Target service (nginx-web-server service)
  targetUrl: "http://nginx-web-server:8080"
  targetHost: "nginx-web-server"
  targetPort: 8080
  # Workload script to use
  # Options: compose-review.lua (write-only), mixed-workload.lua (50% read page, 30% read info, 20% write)
  script: "mixed-workload.lua"
  # Endpoint path (not used for mixed-workload.lua, script handles endpoints internally)
  endpoint: "/wrk2-api/review/compose"
  # Number of threads
  threads: 2
  # Number of connections
  connections: 2
  # Duration of the test (e.g., 30s, 5m, 1h, or "0" for infinite mode)
  # Set to "0" to trigger infinite mode (as implemented in modified wrk2)
  duration: "0"
  # Requests per second
  rate: 10
  # Additional wrk2 arguments
  additionalArgs: "-D exp -L"

# Whether to enable the load generator
enabled: true
