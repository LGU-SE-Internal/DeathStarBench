name: load-generator

global:
  replicas: 1
  imagePullPolicy: "IfNotPresent"

container:
  name: load-generator
  image: 10.10.10.240/library/mediamicroservices-loader
  imageVersion: "latest"

# Load test configuration
loadTest:
  enabled: true
  # Target service (nginx-web-server service)
  targetUrl: "http://nginx-web-server:8080"
  targetHost: "nginx-web-server"
  targetPort: 8080
  # Workload script to use
  script: "compose-review.lua"
  # Endpoint path
  endpoint: "/wrk2-api/review/compose"
  # Number of threads
  threads: 2
  # Number of connections
  connections: 2
  # Duration of the test (e.g., 30s, 5m, 1h)
  # When continuous is true, this is the duration of each test cycle before restarting
  duration: "30s"
  # Requests per second
  rate: 10
  # Additional wrk2 arguments
  additionalArgs: "-D exp -L"
  # Continuous mode: if true, the load test will run in a loop and restart automatically
  # If false, it runs once with the specified duration then sleeps
  continuous: false

# Whether to enable the load generator
enabled: true
