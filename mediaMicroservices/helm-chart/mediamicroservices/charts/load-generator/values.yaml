name: load-generator

global:
  replicas: 1
  imagePullPolicy: "IfNotPresent"

container:
  name: load-generator
  image: 10.10.10.240/library/mediamicroservices-loader
  imageVersion: "latest"

# Load test configuration
loadTest:
  enabled: true
  # Target service (nginx-web-server service)
  targetUrl: "http://nginx-web-server:8080"
  # Workload script to use
  script: "compose-review.lua"
  # Endpoint path
  endpoint: "/wrk2-api/review/compose"
  # Number of threads
  threads: 2
  # Number of connections
  connections: 2
  # Duration of the test (e.g., 30s, 5m, 1h)
  duration: "30s"
  # Requests per second
  rate: 10
  # Additional wrk2 arguments
  additionalArgs: "-D exp -L"

# Whether to enable the load generator
enabled: true
