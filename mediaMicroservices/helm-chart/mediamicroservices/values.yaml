global:
  replicas: 1
  imagePullPolicy: "IfNotPresent"
  restartPolicy: Always
  serviceType: ClusterIP
  # Generous default so cpu_stress / memory_stress chaos faults have a finite
  # limit to breach (aegis#563). Thrift business services idle at 1-7m CPU /
  # <13Mi mem, so a 500m / 1Gi cap never throttles normal traffic but an
  # aggressive 4-worker stress fault overshoots it cleanly. Per-service
  # overrides (container.resources) only where the measured peak needs more
  # headroom (nginx-web-server). Infra (mongodb/memcached/redis) inherits the
  # same non-throttling ceiling — it is never tightened.
  resources: |-
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 1Gi
  # Registry that hosts the mediamicroservices-built images (nginx-web-server,
  # movie services, cast-info, review, text, unique-id, loader, etc.). This
  # chart has no sensible public default — images are built from this
  # repository and must be hosted somewhere the cluster can reach. Consumers
  # MUST set this value explicitly; leaving it blank causes helm
  # template/install to fail with an explanatory message.
  #
  # Example values:
  #   dockerRegistry: docker.io/opspai       # Docker Hub namespace
  #   dockerRegistry: ghcr.io/lgu-se-internal # GitHub Container Registry
  #   dockerRegistry: 10.10.10.240/library    # private harbor
  dockerRegistry: ""
  # Registry for infrastructure images (memcached, mongodb, redis, busybox,
  # git, etc.). Defaults to dockerRegistry for back-compat. Override this
  # when your app images live in a private registry but infra is pulled from
  # a public one.
  #
  # Infra image names are flat (memcached, mongo, redis, busybox, git) so
  # that setting global.dockerRegistry=docker.io/<org> works with flat
  # Docker Hub registries (which do NOT allow nested repos like
  # <org>/library/memcached).
  #
  # To use PUBLIC docker.io images as infra (no mirror needed), set:
  #   global.infraDockerRegistry=docker.io/library
  # (all infra in this chart lives under docker.io/library).
  infraDockerRegistry: ""  # blank = fallback to dockerRegistry
  defaultImageVersion: "778a8df"
  nginx:
    resolverName: kube-dns.kube-system.svc.cluster.local
  otel:
    # OTEL collector endpoint in "host:port" form (scheme auto-prefixed as
    # http:// if omitted). Defaults to the per-namespace collector deployed
    # by this chart (templates/otel-collector-*.yaml). When empty, the
    # template falls back to the node-local DaemonSet default
    # ($(NODE_IP):4318) which assumes an OTel-collector DaemonSet is
    # scheduled on every node (e.g. the opentelemetry-kube-stack preset
    # used on kind clusters).
    #
    # To send to a shared cluster-wide collector instead, also set
    # otelCollector.enabled=false and override here, e.g.:
    #   otel.endpoint: opentelemetry-kube-stack-deployment-collector.monitoring.svc.cluster.local:4318
    endpoint: "otel-collector:4318"
    samplerParam: 1
    disabled: false

# Per-namespace OpenTelemetry collector. One Deployment + Service +
# ConfigMap + ServiceAccount/ClusterRole/Binding rendered into the release
# namespace, exporting directly to ClickHouse. Each release gets its own
# sending_queue so a noisy namespace cannot starve sibling namespaces of
# their queue capacity.
otelCollector:
  enabled: true
  name: otel-collector
  replicas: 1
  image:
    # Public upstream image; aegis byte-cluster pulls via its registry
    # mirror automatically. Override --set otelCollector.image.repository=...
    # to use a private mirror.
    repository: docker.io/opspai/opentelemetry-collector-contrib
    tag: "0.142.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi
  clickhouse:
    endpoint: "tcp://clickstack-clickhouse-clickhouse-headless.monitoring.svc.cluster.local:9000?dial_timeout=10s&compress=lz4&username=default"
    database: otel
    tracesTableName: otel_traces
    metricsTableName: otel_metrics
    logsTableName: otel_logs
    ttl: 72h
    timeout: 30s
  sendingQueue:
    enabled: true
    numConsumers: 10
    queueSize: 5000
  batch:
    sendBatchSize: 2000
    sendBatchMaxSize: 4000
    timeout: 5s
  memoryLimiter:
    limitPercentage: 75
    spikeLimitPercentage: 15

# Chart-bound PointManifest auto-import (aegis-points library subchart).
# When enabled, a post-install/post-upgrade Job imports every
# aegis-points/*.yaml into aegis-chaos so the chaos point catalog for this
# system is populated automatically on RestartPedestal install — no manual
# 'aegisctl manifest import-dir' step.
aegis:
  chaosServer: http://aegis-chaos.aegis.svc:8082
  points:
    enabled: true
    keepGoing: false
  aegisctlImage: opspai/aegisctl:latest
  # The import Job only calls the aegis-chaos HTTP API (no k8s API access),
  # so the namespace default ServiceAccount is sufficient. Leaving this empty
  # would default to "<Release.Name>-aegis", which these charts do not create.
  serviceAccount: default
  imagePullPolicy: IfNotPresent
