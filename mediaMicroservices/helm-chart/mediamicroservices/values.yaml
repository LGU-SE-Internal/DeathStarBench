global:
  replicas: 1
  imagePullPolicy: "IfNotPresent"
  restartPolicy: Always
  serviceType: ClusterIP
  # Registry that hosts the mediamicroservices-built images (nginx-web-server,
  # movie services, cast-info, review, text, unique-id, loader, etc.). This
  # chart has no sensible public default — images are built from this
  # repository and must be hosted somewhere the cluster can reach. Consumers
  # MUST set this value explicitly; leaving it blank causes helm
  # template/install to fail with an explanatory message.
  #
  # Example values:
  #   dockerRegistry: docker.io/opspai       # Docker Hub namespace
  #   dockerRegistry: ghcr.io/lgu-se-internal # GitHub Container Registry
  #   dockerRegistry: 10.10.10.240/library    # private harbor
  dockerRegistry: ""
  # Registry for infrastructure images (memcached, mongodb, redis, busybox,
  # git, etc.). Defaults to dockerRegistry for back-compat. Override this
  # when your app images live in a private registry but infra is pulled from
  # a public one.
  #
  # Infra image names are flat (memcached, mongo, redis, busybox, git) so
  # that setting global.dockerRegistry=docker.io/<org> works with flat
  # Docker Hub registries (which do NOT allow nested repos like
  # <org>/library/memcached).
  #
  # To use PUBLIC docker.io images as infra (no mirror needed), set:
  #   global.infraDockerRegistry=docker.io/library
  # (all infra in this chart lives under docker.io/library).
  infraDockerRegistry: ""  # blank = fallback to dockerRegistry
  defaultImageVersion: "778a8df"
  nginx:
    resolverName: kube-dns.kube-system.svc.cluster.local
  otel:
    # OTEL collector endpoint in "host:port" form (scheme auto-prefixed as
    # http:// if omitted). When empty, the template falls back to the
    # node-local DaemonSet default ($(NODE_IP):4318) which assumes an
    # OTel-collector DaemonSet is scheduled on every node (e.g. the
    # opentelemetry-kube-stack preset used on kind clusters).
    #
    # For clusters that only expose a Deployment collector (e.g. VKE Byte),
    # set:
    #   otel.endpoint: opentelemetry-kube-stack-deployment-collector.monitoring.svc.cluster.local:4318
    endpoint: ""
    samplerParam: 1
    disabled: false
