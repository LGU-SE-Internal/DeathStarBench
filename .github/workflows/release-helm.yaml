name: Publish Helm Charts

on:
  push:
    branches:
      - master
    paths:
      - 'hotelReservation/helm-chart/hotelreservation/**'
      - 'socialNetwork/helm-chart/socialnetwork/**'
      - 'mediaMicroservices/helm-chart/mediamicroservices/**'
      - 'scripts/publish-helm.sh'
      - '.github/workflows/release-helm.yaml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to gh-pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.0
        with:
          version: 'v3.16.3'

      - name: Package charts and build index
        run: bash scripts/publish-helm.sh

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .deploy
          publish_branch: gh-pages
          force_orphan: true
